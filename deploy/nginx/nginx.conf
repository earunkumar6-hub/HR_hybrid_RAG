# Reverse proxy for the Streamlit frontend, with the websocket upgrade
# headers Streamlit's live UI needs (without these, the app loads but
# stays stuck on "Please wait..." because the websocket connection fails).
#
# Edit `server_name` below, and put a real certificate at the paths
# referenced in the HTTPS server block (e.g. via certbot in webroot mode,
# or copy in certs issued elsewhere). Until you have real certs, comment
# out the HTTPS server block and just use the HTTP one.

upstream streamlit_frontend {
    server frontend:8501;
}

# ---- HTTP: redirect to HTTPS once you have certs; plain proxy until then ----
server {
    listen 80;
    server_name your-domain.example.com;

    # Uncomment once the HTTPS block below is active with real certs:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://streamlit_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

